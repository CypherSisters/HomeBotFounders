# Hands-free follow-ups, on by default.
#
# After HomeBot answers, the microphone stays open for PUFF_FOLLOWUP_WINDOW
# seconds (default 10) so a follow-up that sounds like a request is heard
# without saying the wake word again. Room talk and singing along are not
# taken as follow-ups (PUFF_FOLLOWUP_MODE=request, the default), and a chain
# of follow-ups stops after PUFF_FOLLOWUP_MAX_CHAIN turns. Audio never leaves
# the box either way.
#
# To turn it off, delete this file (or set PUFF_FOLLOWUP=0), then run:
#   systemctl --user daemon-reload && systemctl --user restart puffpai-voice
[Service]
Environment=PUFF_FOLLOWUP=1
