<text x="366" y="147" class="tm">RSS headlines</text>
<rect x="576" y="112" width="208" height="46" rx="6" class="shut"/>
<text x="586" y="131" class="tb">Radio directories</text>
<text x="586" y="147" class="tm">Radio Browser, TuneIn</text>
<rect x="796" y="112" width="208" height="46" rx="6" class="shut"/>
<text x="806" y="131" class="tb">Web search</text>
<text x="806" y="147" class="tm">your own SearXNG</text>
