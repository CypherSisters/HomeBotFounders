<text x="328" y="927" class="tm">port open to the LAN</text>
<rect x="460" y="916" width="22" height="14" rx="3" class="ilo"/>
<text x="488" y="927" class="tm">loopback only</text>
<rect x="580" y="916" width="22" height="14" rx="3" class="key"/>
<text x="608" y="927" class="tm">runs inside the box</text>
<circle cx="736" cy="923" r="3.5" class="opt"/>
<text x="746" y="927" class="tm">optional, you set it up</text>
<rect x="880" y="916" width="22" height="14" rx="3" class="shut"/>
<text x="908" y="927" class="tm">switch shut</text>
<line x1="980" y1="923" x2="1014" y2="923" class="ln" marker-end="url(#a)"/>
<text x="1020" y="927" class="tm">who opens the connection</text>
<text x="24" y="972" class="tm">Nothing leaves your computer without your consent. Every registered way out is a named switch, and each one ships shut.</text>
<text x="24" y="988" class="tm">Two paths sit outside the switches: optional containers you start yourself, like the Spotify speaker, and the optional DNS filter&#x27;s upstream lookups.</text>
</svg>
