<rect x="0" y="0" width="1240" height="1000" class="bg"/>
<text x="24" y="38" class="tt">HomeBot Founders: how it fits together</text>
<text x="24" y="58" class="tm">One Jetson AGX Orin runs the voice, the models, the house control and the library. Three zones: the Vault keeps, the Brain thinks, the Bridge is the only way out.</text>
<rect x="8" y="74" width="1224" height="156" rx="10" class="net"/>
<text x="24" y="98" class="ey">INTERNET</text>
<text x="124" y="98" class="tm">Reached only through a named Bridge switch. Each call is written to the egress ledger.</text>
<text x="24" y="140" class="tb cs">Ships shut</text>
<text x="24" y="156" class="tm">you open each</text>
<text x="24" y="170" class="tm">one yourself</text>
<rect x="136" y="112" width="208" height="46" rx="6" class="shut"/>
