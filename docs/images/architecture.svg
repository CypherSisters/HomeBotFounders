<rect x="300" y="340" width="640" height="560" rx="10" class="orin"/>
<text x="316" y="364" class="th">Orin (HomeBot)</text>
<text x="316" y="382" class="tm">The backend on :8000 needs its API key. The dashboard on :3003 pairs each phone with a code.</text>
<text x="316" y="396" class="tm">Loopback services never answer the LAN. Small dots mark the parts you add yourself.</text>
