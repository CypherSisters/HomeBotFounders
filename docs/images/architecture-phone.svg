<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 2106" width="600" height="2106" role="img" aria-label="HomeBot Founders architecture. The Orin running HomeBot sits on your home network behind your router. Inside it, the Vault, Brain and Bridge zones hold the services and their ports. Phones, browsers, media apps, Home Assistant and TVs connect to it on the LAN. The only way to the internet is through Bridge switches, and every one ships shut.">
<title>HomeBot Founders architecture</title>

